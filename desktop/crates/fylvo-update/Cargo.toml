[package]
name = "fylvo-update"
version = "0.1.0"
edition = "2021"
description = "Fylvo Desktop: updates from the app (check, download, verify; install per platform)"

[dependencies]
anyhow = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.35", features = ["fs", "io-util", "time"] }
tracing = "0.1"
url = "2.5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Management_Deployment",
    "System",
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Recovery",
    "Win32_UI_Shell",
]

[target.'cfg(windows)'.dependencies]
windows-core = "0.58.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
tempfile = "3"
