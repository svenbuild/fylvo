[workspace]
resolver = "2"
members = [
    "crates/cloudreve-api",
    "crates/cloudreve-sync",
    "crates/win32_notif",
    "crates/fylvo-update",
    "src-tauri",
]

# Smaller and faster app: the whole program optimized as one, without symbols.
[profile.release]
lto = true
codegen-units = 1
strip = true
