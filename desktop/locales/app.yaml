  ko: "로컬 경로는 루트 드라이브(예: E:\\)가 될 수 없습니다. 하위 폴더를 선택하세요."
  ru: "Локальный путь не может быть корневым диском (например, E:\\). Пожалуйста, выберите подпапку."
  pl: "Ścieżka lokalna nie może być dyskiem głównym (np. E:\\). Proszę wybrać podfolder."
  it: "Il percorso locale non può essere un'unità radice (es. E:\\). Seleziona una sottocartella."
massDeleteServerTitle:
  en-US: "Many files deleted"
  zh-CN: "删除了大量文件"
  zh-TW: "刪除了大量檔案"
  ja: "多数のファイルが削除されました"
  de: "Viele Dateien gelöscht"
  fr: "De nombreux fichiers supprimés"
  es: "Muchos archivos eliminados"
  ko: "많은 파일이 삭제됨"
  ru: "Удалено много файлов"
  pl: "Usunięto wiele plików"
  it: "Molti file eliminati"
massDeleteServerMessage:
  en-US: "%{count} entries were deleted on this PC. They stay on the server until you confirm in the Fylvo settings."
  zh-CN: "此电脑上删除了 %{count} 个项目。在 Fylvo 设置中确认之前，它们会保留在服务器上。"
  zh-TW: "此電腦上刪除了 %{count} 個項目。在 Fylvo 設定中確認之前，它們會保留在伺服器上。"
  ja: "この PC で %{count} 件の項目が削除されました。Fylvo の設定で確認するまで、サーバー上に残ります。"
  de: "%{count} Einträge wurden auf diesem PC gelöscht. Auf dem Server bleiben sie, bis Sie es in den Fylvo-Einstellungen bestätigen."
  fr: "%{count} éléments ont été supprimés sur ce PC. Ils restent sur le serveur jusqu'à votre confirmation dans les paramètres de Fylvo."
  es: "Se eliminaron %{count} elementos en este PC. Permanecen en el servidor hasta que lo confirme en los ajustes de Fylvo."
  ko: "이 PC에서 %{count}개 항목이 삭제되었습니다. Fylvo 설정에서 확인할 때까지 서버에 남아 있습니다."
  ru: "На этом ПК удалено элементов: %{count}. Они остаются на сервере, пока вы не подтвердите это в настройках Fylvo."
  pl: "Na tym komputerze usunięto %{count} elementów. Pozostaną na serwerze, dopóki nie potwierdzisz tego w ustawieniach Fylvo."
  it: "Su questo PC sono stati eliminati %{count} elementi. Restano sul server finché non confermi nelle impostazioni di Fylvo."
