  de: "Fylvo Desktop aktualisiert"
updateDoneMessage:
  en-US: "Now running version %{version}."
  de: "Jetzt läuft Version %{version}."
updateFailedTitle:
  en-US: "Update failed"
  de: "Update fehlgeschlagen"
updateFailedMessage:
  en-US: "Version %{version} was not installed: %{reason}. The current version keeps running."
  de: "Version %{version} wurde nicht installiert: %{reason}. Die bisherige Version läuft weiter."
updateNotInstalled:
  en-US: "Windows did not install the update"
  de: "Windows hat das Update nicht installiert"
