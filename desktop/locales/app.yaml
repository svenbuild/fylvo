readOnlyDriveTitle:
  en-US: "Read-only folder"
  zh-CN: "只读文件夹"
  zh-TW: "唯讀資料夾"
  ja: "読み取り専用フォルダー"
  de: "Ordner nur zum Lesen"
  fr: "Dossier en lecture seule"
  es: "Carpeta de solo lectura"
  ko: "읽기 전용 폴더"
  ru: "Папка только для чтения"
  pl: "Folder tylko do odczytu"
  it: "Cartella di sola lettura"
readOnlyDriveMessage:
  en-US: "\"%{drive}\" is shared with you for reading only. Changes on this PC are not uploaded."
  zh-CN: "“%{drive}”以只读方式与你共享。此电脑上的更改不会上传。"
  zh-TW: "「%{drive}」以唯讀方式與你共用。此電腦上的變更不會上傳。"
  ja: "「%{drive}」は読み取り専用で共有されています。この PC での変更はアップロードされません。"
  de: "\"%{drive}\" ist nur zum Lesen mit Ihnen geteilt. Änderungen auf diesem PC werden nicht hochgeladen."
  fr: "« %{drive} » est partagé avec vous en lecture seule. Les modifications sur ce PC ne sont pas envoyées."
  es: "\"%{drive}\" se ha compartido con usted solo para lectura. Los cambios en este PC no se suben."
  ko: "\"%{drive}\"은(는) 읽기 전용으로 공유되었습니다. 이 PC의 변경 내용은 업로드되지 않습니다."
  ru: "«%{drive}» предоставлен вам только для чтения. Изменения на этом ПК не загружаются."
  pl: "„%{drive}” udostępniono Ci tylko do odczytu. Zmiany na tym komputerze nie są przesyłane."
  it: "\"%{drive}\" è condiviso con te in sola lettura. Le modifiche su questo PC non vengono caricate."
moveBetweenDrivesTitle:
  en-US: "Move not possible"
  zh-CN: "无法移动"
  zh-TW: "無法移動"
  ja: "移動できません"
  de: "Verschieben nicht möglich"
  fr: "Déplacement impossible"
  es: "No se puede mover"
  ko: "이동할 수 없음"
  ru: "Перемещение невозможно"
  pl: "Nie można przenieść"
  it: "Spostamento non possibile"
moveBetweenDrivesMessage:
  en-US: "Files cannot be moved between sync folders. Copy them instead and delete the original afterwards."
  zh-CN: "无法在同步文件夹之间移动文件。请先复制，然后删除原文件。"
  zh-TW: "無法在同步資料夾之間移動檔案。請先複製，再刪除原始檔案。"
  ja: "同期フォルダー間でファイルを移動することはできません。コピーしてから元のファイルを削除してください。"
  de: "Zwischen Sync-Ordnern kann nicht verschoben werden. Kopieren Sie die Dateien und löschen Sie danach das Original."
  fr: "Impossible de déplacer des fichiers entre dossiers synchronisés. Copiez-les puis supprimez l'original."
  es: "No se pueden mover archivos entre carpetas sincronizadas. Cópielos y elimine después el original."
  ko: "동기화 폴더 간에는 파일을 이동할 수 없습니다. 복사한 후 원본을 삭제하세요."
  ru: "Нельзя перемещать файлы между папками синхронизации. Скопируйте их и затем удалите оригинал."
  pl: "Nie można przenosić plików między folderami synchronizacji. Skopiuj je, a potem usuń oryginał."
  it: "Non è possibile spostare file tra cartelle sincronizzate. Copiali e poi elimina l'originale."
linuxFileSystemNotSupported:
  en-US: "The folder %{folder} is on a drive that cannot be synced (for example a USB stick with FAT or exFAT, or a network share). Choose a folder in your home folder or on a drive with ext4, btrfs or xfs."
  de: "Der Ordner %{folder} liegt auf einem Laufwerk, das sich nicht abgleichen lässt (zum Beispiel ein USB-Stick mit FAT oder exFAT oder eine Netzwerkfreigabe). Wähle einen Ordner in deinem Benutzerordner oder auf einem Laufwerk mit ext4, btrfs oder xfs."
watchLimitTitle:
  en-US: "Not all changes are noticed"
  de: "Nicht alle Änderungen werden bemerkt"
watchLimitMessage:
  en-US: "The sync folders have more subfolders than Linux lets one program watch. Raise fs.inotify.max_user_watches (see the guide) and restart Fylvo Desktop."
  de: "Die Sync-Ordner haben mehr Unterordner, als Linux einem Programm zu beobachten erlaubt. Erhöhe fs.inotify.max_user_watches (siehe Anleitung) und starte Fylvo Desktop neu."
renameRefusedTitle:
  en-US: "Rename not possible"
  de: "Umbenennen nicht möglich"
renameRefusedMessage:
  en-US: "The server refused the rename or move, so it was undone here. You may not have the rights for this folder."
  de: "Der Server hat das Umbenennen oder Verschieben abgelehnt, deshalb wurde es hier rückgängig gemacht. Vermutlich fehlen dir in diesem Ordner die Rechte."
heldDeletionBusy:
  en-US: "This deletion is being handled already."
  zh-CN: "此删除正在处理中。"
  zh-TW: "此刪除正在處理中。"
  ja: "この削除はすでに処理中です。"
  de: "Diese Löschung wird bereits ausgeführt."
  fr: "Cette suppression est déjà en cours."
  es: "Esta eliminación ya se está procesando."
  ko: "이 삭제는 이미 처리 중입니다."
  ru: "Это удаление уже выполняется."
  pl: "To usuwanie jest już w toku."
  it: "Questa eliminazione è già in corso."
heldDeletionChanged:
  en-US: "More entries were deleted meanwhile. Please look at the number again."
  zh-CN: "期间又删除了更多项目。请重新查看数量。"
  zh-TW: "期間又刪除了更多項目。請重新查看數量。"
  ja: "その間にさらに項目が削除されました。件数をもう一度確認してください。"
  de: "Inzwischen wurden weitere Einträge gelöscht. Bitte prüfen Sie die Zahl noch einmal."
  fr: "D'autres éléments ont été supprimés entre-temps. Vérifiez à nouveau le nombre."
  es: "Mientras tanto se eliminaron más elementos. Revise de nuevo el número."
  ko: "그 사이에 더 많은 항목이 삭제되었습니다. 개수를 다시 확인하세요."
  ru: "За это время удалены ещё элементы. Проверьте число ещё раз."
  pl: "W międzyczasie usunięto więcej elementów. Sprawdź ponownie liczbę."
  it: "Nel frattempo sono stati eliminati altri elementi. Controlla di nuovo il numero."
heldDeletionPartlyFailed:
  en-US: "%{count} entries could not be deleted on the server. They stay held; you can try again or restore them."
  zh-CN: "%{count} 个项目无法在服务器上删除。它们仍被保留，你可以重试或恢复它们。"
  zh-TW: "%{count} 個項目無法在伺服器上刪除。它們仍被保留，你可以重試或還原它們。"
  ja: "%{count} 件の項目をサーバーで削除できませんでした。保留されたままです。再試行するか復元できます。"
  de: "%{count} Einträge konnten auf dem Server nicht gelöscht werden. Sie werden weiterhin zurückgehalten; Sie können es erneut versuchen oder sie wiederherstellen."
  fr: "%{count} éléments n'ont pas pu être supprimés sur le serveur. Ils restent en attente ; vous pouvez réessayer ou les restaurer."
  es: "No se pudieron eliminar %{count} elementos en el servidor. Siguen retenidos; puede intentarlo de nuevo o restaurarlos."
  ko: "%{count}개 항목을 서버에서 삭제하지 못했습니다. 보류 상태로 유지되며, 다시 시도하거나 복원할 수 있습니다."
  ru: "Не удалось удалить на сервере элементов: %{count}. Они остаются задержанными; можно повторить попытку или восстановить их."
  pl: "Nie udało się usunąć %{count} elementów na serwerze. Pozostają wstrzymane; możesz spróbować ponownie lub je przywrócić."
  it: "Non è stato possibile eliminare %{count} elementi sul server. Restano in sospeso; puoi riprovare o ripristinarli."
