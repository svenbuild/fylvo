driveLetterTakenTitle:
  en-US: "Drive letter in use"
  de: "Laufwerksbuchstabe belegt"
driveLetterTakenMessage:
  en-US: "%{letter}: is used by another drive, so \"%{drive}\" does not show there. Choose another letter in the Fylvo settings."
  de: "%{letter}: wird von einem anderen Laufwerk verwendet, darum erscheint \"%{drive}\" dort nicht. Wählen Sie in den Fylvo-Einstellungen einen anderen Buchstaben."
driveLetterNotFree:
  en-US: "%{letter}: is not free."
  de: "%{letter}: ist nicht frei."
driveLetterNoneFree:
  en-US: "No drive letter is free."
  de: "Kein Laufwerksbuchstabe ist frei."
caseClashTitle:
  en-US: "Names differ only in case"
  de: "Namen unterscheiden sich nur in Gross-/Kleinschreibung"
caseClashMessage:
  en-US: "\"%{name}\" exists more than once, spelled with different upper/lower case. Windows can keep only one of them in a folder; the other stays online only for now. Rename one of them in the web app."
  de: "\"%{name}\" gibt es mehrfach, nur mit anderer Gross-/Kleinschreibung. Windows kann davon nur einen in einem Ordner haben, der andere bleibt nur online. Benennen Sie einen davon in der Web-App um."
caseHeldMessage:
  en-US: "\"%{name}\" on this PC and on the server differ only in upper/lower case, and it is not sure they are the same file. Nothing is changed for this name until you rename one of them."
  de: "\"%{name}\" auf diesem PC und auf dem Server unterscheiden sich nur in Gross-/Kleinschreibung, und es ist nicht sicher, dass es dieselbe Datei ist. Für diesen Namen wird nichts geändert, bis Sie einen davon umbenennen."
caseTakenMessage:
  en-US: "\"%{name}\" could not be saved on the server: the folder there has this name already in other upper/lower case. If the name was just changed on the server, the app catches up by itself shortly; otherwise rename one of them."
  de: "\"%{name}\" konnte nicht auf dem Server gespeichert werden: Im Ordner dort gibt es den Namen schon mit anderer Gross-/Kleinschreibung. Wurde der Name gerade am Server geändert, gleicht die App das gleich selbst ab; sonst benennen Sie einen davon um."
updateDoneTitle:
