<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="{pwa_small_icon}" sizes="64x64" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,shrink-to-fit=no"
    />
    <meta name="theme-color" content="" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="{siteDes}" />
    <title>{siteName}</title>
    <script>
      window.subTitle = "{siteName}";
    </script>
    <style>
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fff;
        color: #62626a;
        z-index: 9999;
      }
      #app-loader .logo {
        width: 48px;
        height: 48px;
        margin-bottom: 12px;
        background-image: url("{pwa_medium_icon}");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
      }
      #app-loader .spinner {
        width: 18px;
        height: 18px;
      }
      #app-loader .spinner svg {
        display: block;
        animation: loader-spin 1.4s linear infinite;
      }
      #app-loader .spinner .stroke {
        stroke: var(--defaultThemeColor, currentColor);
        stroke-linecap: round;
        stroke-dasharray: 28 126;
      }
      #app-loader .spinner .background {
        stroke: currentColor;
        opacity: 0.2;
      }

      @media (prefers-color-scheme: dark) {
        #app-loader {
          background-color: #0a0a0a;
          color: #a9a9b0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .spinner svg {
          animation: none;
        }
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app-loader">
      <div class="logo"></div>
      <div class="spinner">
        <svg viewBox="22 22 44 44">
          <circle class="background" cx="44" cy="44" r="20" fill="none" stroke-width="4"></circle>
          <circle class="stroke" cx="44" cy="44" r="20" fill="none" stroke-width="4"></circle>
        </svg>
      </div>
    </div>
    <script async type="module" src="/src/main.tsx"></script>
    <div id="root"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // The server swaps the script placeholder at the end of this file for the site script.
        // The Vite dev server does not, so remove the leftover text there. The name is split
        // on purpose: written in one piece, the server would replace it here as well.
        const leftover = "{" + "siteScript}";
        Array.from(document.body.childNodes).forEach(function (node) {
          if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() === leftover) node.remove();
        });
        // Hide loader when the app has loaded
        const appRoot = document.getElementById("root");
        const observer = new MutationObserver(function (mutations) {
          if (appRoot.children.length > 0) {
            document.getElementById("app-loader").style.display = "none";
            observer.disconnect();
          }
        });
        observer.observe(appRoot, { childList: true });
      });
    </script>
  </body>
  {siteScript}
</html>
