name: Promote

# When a release is published (not a pre-release), its image also becomes :1.2, :1 and :latest,
# each only if it is the newest published release in that range: a later fix for an older version
# never moves users back. Until then only :1.2.3 exists (release.yml), so "docker compose pull"
# never gets a draft.

on:
  release:
    types: [published]

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read    # the list of releases
      packages: write
    steps:
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || { echo "Tag $TAG is not vX.Y.Z" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail
          releases="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')"
          stable="$(printf '%s\n' "$releases" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          printf '%s\n' "$stable" | grep -qx -- "$VERSION" || { echo "Release $VERSION is not in the list of published releases" >&2; exit 1; }
          # The newest published version that starts with the given text ("" for all).
          newest() { printf '%s\n' "$stable" | awk -v p="$1" 'index($0, p) == 1' | sort -V | tail -n 1; }
          tags=()
          if [ "$(newest "$MINOR.")" = "$VERSION" ]; then tags+=(-t "$IMAGE:$MINOR"); fi
          if [ "$(newest "$MAJOR.")" = "$VERSION" ]; then tags+=(-t "$IMAGE:$MAJOR"); fi
          if [ "$(newest "")" = "$VERSION" ]; then tags+=(-t "$IMAGE:latest"); fi
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "Newer releases hold :$MINOR, :$MAJOR and :latest; nothing to move."
            exit 0
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$VERSION"
