name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Go version and toolchain come from go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Node 22 is the version the upstream release pipeline used; the frontend declares none.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # Builds the web app, embeds it (application/statics/assets.zip) and builds release/fylvo-linux-amd64.
      # Must run before the tests: the server packages embed assets.zip and do not compile without it.
      - name: Build release
        run: scripts/build.sh

      - name: Go tests
        run: scripts/test.sh

      - name: Short commit
        id: commit
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: fylvo-${{ steps.commit.outputs.short }}
          path: release/fylvo-linux-amd64
          if-no-files-found: error
          retention-days: 30

  # The Craft editors of the image (Dockerfile stage "craft"): fetched and checked against
  # scripts/craft/craft.lock, so a wrong sum or signature fails here and not at a release.
  craft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Craft editors
        run: |
          set -euo pipefail
          docker build --target craft -t fylvo-craft .
          docker run --rm fylvo-craft sh -c 'for a in wordcraft gridcraft deckcraft pdfcraft; do test -f "/craft/$a/index.html" || { echo "$a is missing" >&2; exit 1; }; done'
